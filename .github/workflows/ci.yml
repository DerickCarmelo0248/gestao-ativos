name: Seguranca e qualidade

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 9 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  php:
    name: PHP e testes
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: gestao_ativos_test
          POSTGRES_USER: gestao_test
          # Credencial descartável, apenas do container deste job.
          POSTGRES_PASSWORD: ci-only-database
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gestao_test -d gestao_ativos_test"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_DATABASE: gestao_ativos_test
      DB_USERNAME: gestao_test
      DB_PASSWORD: ci-only-database
      DB_URL: ''
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      BCRYPT_ROUNDS: '4'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          extensions: mbstring, dom, fileinfo, curl, pdo_pgsql, pgsql, gd, zip, xml, xmlreader, xmlwriter
          tools: composer:2.10.3
          coverage: none
      - name: Validar manifesto e dependencias conhecidas
        run: |
          composer validate --strict
          composer audit --locked --no-interaction
      - name: Instalar dependencias fixadas
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Conferir extensoes e sintaxe PHP
        run: |
          composer check-platform-reqs
          find app bootstrap config database routes tests scripts -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php scripts/ci/check-repository.php
      - name: Preparar ambiente descartavel
        run: |
          cp .env.example .env
          php artisan key:generate --force
          php artisan config:clear
          php artisan migrate --force
      - name: Compilar telas Blade
        run: php artisan view:cache
      - name: Executar testes
        run: php artisan test

  frontend:
    name: Frontend e dependencias
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Instalar dependencias fixadas sem scripts de instalacao
        run: npm ci --ignore-scripts --no-fund
      - name: Bloquear vulnerabilidades moderadas ou superiores
        run: npm audit --audit-level=moderate
      - name: Compilar frontend
        run: npm run build

  secrets:
    name: Segredos no historico
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Instalar Gitleaks com verificacao de modulos Go
        env:
          GOBIN: ${{ runner.temp }}/gitleaks-bin
          GOSUMDB: sum.golang.org
          GOPROXY: https://proxy.golang.org
          GOTOOLCHAIN: auto
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Buscar segredos sem revelar seus valores
        run: '"$RUNNER_TEMP/gitleaks-bin/gitleaks" git --redact --no-banner --log-opts="--all" .'

  sast:
    name: Analise de codigo
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Detectar padroes PHP de risco
        run: >-
          docker run --rm --volume "$PWD:/src:ro" --workdir /src
          semgrep/semgrep:1.154.0
          semgrep scan --config .semgrep.yml --error --strict --metrics=off
          --disable-version-check app routes

  gate:
    name: CI aprovada
    if: always()
    needs: [php, frontend, secrets, sast]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Exigir sucesso de todas as verificacoes
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")'
